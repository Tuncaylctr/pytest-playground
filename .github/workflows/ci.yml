name: CI

on:
  push:
    branches:
      - main
    paths:
      - "ci-cd/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "ci-cd/**"
      - ".github/workflows/**"

defaults:
  run:
    working-directory: ci-cd

jobs:
  test:
    runs-on: ${{matrix.os}}

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: ['ubuntu-latest', 'windows-latest', 'macos-latest']
        tests-level: ['unit', 'integration', 'system']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{matrix.python-version}}
        uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}

      - name: Install dependencies
        run: |
          python -m pip install -U pip wheel
          pip install -e ".[dev]"

      - name: Quick CLI smoke test
        run: |
          units-convert --help || (echo "CLI missing" && exit 1)

      - name: Run tests with coverage
        run: |
          pytest tests/${{matrix.tests-level}}
