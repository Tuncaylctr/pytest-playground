name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -U pip wheel
          pip install -e ".[dev]"

      - name: Quick CLI smoke test
        run: |
          units-convert --help || (echo "CLI missing" && exit 1)

      - name: Run tests with coverage
        run: |
          pytest
